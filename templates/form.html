<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Interesse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Formulário de Interesse</h2>
    <form method="post" class="card p-4 shadow">
      <div class="mb-3">
        <label class="form-label">Curso:</label>
        <input type="text" class="form-control" name="curso" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Período:</label>
        <input type="text" class="form-control" name="periodo" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo de Entidade:</label>
        <select class="form-select" name="tipo" required>
          <option>Esportes</option>
          <option>Cultura</option>
          <option>Técnica</option>
          <option>Acadêmica</option>
          <option>Política</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Prefere atividades em grupo ou individuais?</label>
        <select class="form-select" name="pergunta1" required>
          <option value="grupo">Grupo</option>
          <option value="individual">Individual</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Prefere atividades mais práticas ou teóricas?</label>
        <select class="form-select" name="pergunta2" required>
          <option value="práticas">Práticas</option>
          <option value="teóricas">Teóricas</option>
        </select>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>
    <div class="mt-3 text-center">
      <a href="/" class="btn btn-secondary">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
